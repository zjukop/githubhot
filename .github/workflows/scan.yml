name: Publish daily GitHubHot digest

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: githubhot-daily-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan candidate repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANALYSIS_API_KEY: ${{ secrets.ANALYSIS_API_KEY }}
          ANALYSIS_BASE_URL: ${{ vars.ANALYSIS_BASE_URL }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL }}
        run: |
          ANALYZE_ARGS=""
          if [ -n "$ANALYSIS_API_KEY" ]; then
            ANALYZE_ARGS="--analyze 10"
          else
            echo "ANALYSIS_API_KEY is not configured; publishing official-source fallback profiles"
          fi
          python -m githubhot scan --days 30 --min-stars 100 --limit 50 --enrich 10 $ANALYZE_ARGS
      - name: Generate daily digest and update index
        run: python -m githubhot digest --top 10
      - name: Verify generated content
        run: |
          python -m unittest discover -s tests -v
          if grep -R "TODO" "daily/$(date -u +%Y)/$(date -u +%m)/$(date -u +%F).md"; then
            echo "Generated digest contains unfinished TODO markers"
            exit 1
          fi
      - name: Commit daily result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md daily data/snapshots
          if git diff --cached --quiet; then
            echo "No daily changes to publish"
            exit 0
          fi
          git commit -m "daily: publish GitHubHot $(date -u +%F)"
          git push
