name: Prepare daily candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan candidate repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m githubhot scan --days 30 --min-stars 100 --limit 50
      - uses: actions/upload-artifact@v4
        with:
          name: githubhot-candidates
          path: |
            data/candidates.json
            data/snapshots/*.json
          retention-days: 14

